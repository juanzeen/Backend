name: NBA Daily Sync

on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Daily Sync on Fly.io
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -f -s -S -X POST "https://nba-fantastic-api.fly.dev/api/v1/jobs/daily-sync" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --max-time 180 | jq .
